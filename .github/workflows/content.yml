name: Update health content
on:
  schedule:
    - cron: '17 3 * * *'   # every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4 markdown
      # each source may fail on its own; the build step keeps the last good copy
      - continue-on-error: true
        run: python3 tools/fetch_owh.py
      - continue-on-error: true
        run: PYTHONPATH=tools/sources python3 tools/sources/cdc.py
      - continue-on-error: true
        run: PYTHONPATH=tools/sources python3 tools/sources/medlineplus.py
      - continue-on-error: true
        run: PYTHONPATH=tools/sources python3 tools/sources/ods.py
      - continue-on-error: true
        run: PYTHONPATH=tools/sources python3 tools/sources/nhs_debug.py || true; PYTHONPATH=tools/sources python3 tools/sources/nhs.py
        env:
          NHS_API_KEY: ${{ secrets.NHS_API_KEY }}
      - run: python3 tools/build_content.py
      - name: Publish
        run: |
          git config user.name velyn-bot && git config user.email velyn-bot@users.noreply.github.com
          git add content && (git diff --cached --quiet && echo "no change" || (git commit -m "Content update $(date -u +%F)" && git push))
